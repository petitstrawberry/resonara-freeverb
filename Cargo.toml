[package]
name = "freeverb-scarlet"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/petitstrawberry/freeverb-scarlet"
description = "Freestanding stereo Freeverb CLAP reverb for Scarlet OS"
[lib]
crate-type = ["cdylib"]
[dependencies]
clap-sys = { path = "vendor/clap-sys", version = "=0.5.0" }
[dev-dependencies]
clap-sys-upstream = { package = "clap-sys", version = "=0.5.0" }
freeverb-reference = { package = "freeverb", path = "vendor/freeverb" }
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
debug = 0
[workspace]
